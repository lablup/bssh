[package]
name = "bssh-russh-sftp"
version = "3.0.1"
authors = ["Jeongkyu Shin <inureyes@gmail.com>"]
description = "Temporary fork of russh-sftp 3.0.1 adding pipelined SFTP File I/O helpers (write_all_pipelined / read_to_writer_pipelined) and a server request read-ahead loop with sequential write coalescing."
documentation = "https://docs.rs/bssh-russh-sftp"
edition = "2021"
homepage = "https://github.com/lablup/bssh"
keywords = ["russh", "sftp", "ssh2", "server", "client"]
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/lablup/bssh"

# Dependency versions mirror upstream russh-sftp 3.0.1 (AspectUnk/russh-sftp).
# Update via ./sync-upstream.sh; the only fork addition is the `futures` dep,
# needed by the forward-ported pipelined helpers in src/client/fs/file.rs.
[dependencies]
tokio = { version = "1.52.3", default-features = false, features = [
    "io-util",
    "rt",
    "sync",
    "time",
    "macros",
] }
tokio-util = { version = "0.7.19", default-features = false, features = ["rt"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_bytes = "0.11.19"
bitflags = { version = "2.13.1", features = ["serde"] }
async-trait = { version = "0.1.92", optional = true }

# futures: required by our forward-ported pipelined helpers
# (write_all_pipelined / read_to_writer_pipelined use FuturesUnordered).
# Upstream russh-sftp only needs this as a dev-dependency.
futures = { version = "0.3.32", default-features = false, features = ["std", "async-await"] }

thiserror = "2.0.20"
chrono = "0.4.45"
bytes = "1.12.1"
log = "0.4.34"
dashmap = "6.2.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4.78"
gloo-timers = { version = "0.4.0", features = ["futures"] }

[features]
async-trait = ["dep:async-trait"]

# The vendored src/ tracks upstream verbatim and sync-upstream.sh replaces it
# wholesale, so std deprecations there (e.g. Atomic*::fetch_update, renamed
# try_update in Rust 1.99) are upstream's to migrate. Keep them from failing
# `clippy -D warnings` on newer toolchains without editing vendored code.
[lints.rust]
deprecated = "allow"
